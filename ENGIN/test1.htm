<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Simple Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #0f1b6b;
            color: white;
            text-align: center;
            padding: 1em 0;
        }

        .content {
            padding: 20px;
        }

        .center {
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 50%;
        }

        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
            margin-left: auto;
            margin-right: auto;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>Nathan Yu</h1>
        <h2>Computer Engineering</h2>
        <h2>Portfolio</h2>
    </header>

    <div class="content">
        <img src="CompEng.jpg" alt="CompEng" width="500" height="300" class="center">
    </div>

    <div class="content">
        <table>
            <tr>
                <th>Student Information Sheet:</th>
                <th></th>
                <th></th>
            </tr>
            <tr></tr>
            <tr></tr>
            <tr>
                <td>Raspberry Pi</td>
                <td>Arduino</td>
                <td>LEGO NX5</td>
            </tr>
        </table>
    </div>

    <footer>
        <p>&copy; Nathan Yu Portfolio</p>
    </footer>

</body>

</html>
